name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The test suite mocks WhisperX/torch, so skip that multi-GB install and
      # only bring in what the tests import.
      - name: Install test dependencies
        run: |
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" \
            "pydantic-settings>=2.3" "python-multipart>=0.0.9" "google-genai>=0.3" \
            yt-dlp anthropic google-api-python-client google-auth-oauthlib "pytest>=8.2" "httpx>=0.27" "ruff>=0.6"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Check shell scripts
        run: shellcheck deploy/*.sh

  # After the tests pass on main, update the live server. The SSH key in the
  # DEPLOY_SSH_KEY secret can only run deploy/auto-update.sh there (it's
  # locked to that script in the server's authorized_keys). Without the
  # secrets this job does nothing, so forks and PRs are unaffected.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Waits up to 45 min for running meetings, then the build itself.
    timeout-minutes: 75
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 3.126.252.9
    steps:
      - name: Update the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST_KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY / DEPLOY_HOST_KEY not set, skipping the server update."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          # The key is stored base64 on one line (multi-line keys get mangled
          # when copied out of a terminal). A plain BEGIN...END key works too.
          if printf '%s' "$SSH_KEY" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy
          else
            printf '%s' "$SSH_KEY" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy || true
          fi
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY isn't a valid key. On the server run: base64 -w0 ~/.ssh/github_actions_deploy; and paste that one line as the secret."
            exit 1
          fi
          # Pinned server key: refuse to talk to anything pretending to be it.
          host_key="$(printf '%s' "$HOST_KEY" | tr -d '\r\n' | awk '{print $1, $2}')"
          case "$host_key" in
            "ssh-ed25519 "?*) ;;
            *) echo "::error::DEPLOY_HOST_KEY should be one line starting with ssh-ed25519."; exit 1 ;;
          esac
          echo "$DEPLOY_HOST $host_key" > ~/.ssh/known_hosts
          set +e
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            -o ConnectTimeout=20 "ubuntu@$DEPLOY_HOST" update 2> >(tee ssh.err >&2)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Surface the reason as an annotation (shown on the run page).
            reason="$(grep -m1 -iE 'denied|verification|refused|timed out|no route|invalid|error|still|healthy' ssh.err || true)"
            echo "::error::Server update failed (exit $code): ${reason:-see the log above}"
            exit "$code"
          fi
