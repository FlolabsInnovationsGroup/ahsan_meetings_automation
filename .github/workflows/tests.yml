name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The test suite mocks WhisperX/torch, so skip that multi-GB install and
      # only bring in what the tests import.
      - name: Install test dependencies
        run: |
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" \
            "pydantic-settings>=2.3" "python-multipart>=0.0.9" "google-genai>=0.3" \
            yt-dlp google-api-python-client google-auth-oauthlib "pytest>=8.2" "httpx>=0.27" "ruff>=0.6"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Check shell scripts
        run: shellcheck deploy/*.sh
